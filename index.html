<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>De1mos Faceit</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #050807;
            --card: rgba(16, 28, 24, 0.72);
            --border: rgba(0, 255, 156, 0.10);
            --border-strong: rgba(0, 255, 156, 0.22);
            --emerald: #00e08a;
            --emerald-2: #00b874;
            --emerald-3: #22e8a4;
            --text: #e6f5ee;
            --hint: #6d8a80;
            --red: #ff5470;
            --gold: #d9ab5a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; inset: -50%;
            background:
                radial-gradient(circle at 20% 20%, rgba(0,224,138,0.08), transparent 45%),
                radial-gradient(circle at 80% 60%, rgba(0,184,116,0.06), transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(34,232,164,0.05), transparent 55%);
            animation: bgFloat 24s ease-in-out infinite alternate;
            z-index: -2; filter: blur(30px); will-change: transform;
        }
        body::after {
            content: ''; position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(0,224,138,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,224,138,0.025) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at 50% 30%, #000 15%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at 50% 30%, #000 15%, transparent 70%);
            z-index: -1; pointer-events: none;
        }
        @keyframes bgFloat { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(2%, -2%, 0) scale(1.06); } }
        .header {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px;
            background: rgba(5, 8, 7, 0.65);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border-bottom: 1px solid var(--border);
        }
        .avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, var(--emerald), var(--emerald-2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 15px; color: #04140e;
            overflow: hidden;
            box-shadow: 0 0 0 1.5px rgba(0,224,138,0.18), 0 0 12px rgba(0,224,138,0.18);
            animation: pulseGlow 5s ease-in-out infinite; cursor: pointer;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 1.5px rgba(0,224,138,0.18), 0 0 12px rgba(0,224,138,0.18); }
            50% { box-shadow: 0 0 0 1.5px rgba(0,224,138,0.28), 0 0 18px rgba(0,224,138,0.28); }
        }
        .header-title {
            font-size: 17px; font-weight: 800; letter-spacing: 0.6px;
            background: linear-gradient(90deg, #e6f5ee 0%, var(--emerald) 50%, #e6f5ee 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 6s linear infinite;
        }
        .header-title span { -webkit-text-fill-color: var(--emerald); }
        @keyframes shine { 0% { background-position: 0% center; } 100% { background-position: -200% center; } }
        .notif-btn {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(0,224,138,0.06); border: 1px solid var(--border);
            color: var(--emerald); font-size: 17px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .notif-btn:active { transform: scale(0.9); background: rgba(0,224,138,0.14); }
        .container { padding: 18px 16px 100px; }
        .page { display: none; animation: fadeUp 0.4s cubic-bezier(0.2, 0.7, 0.2, 1); }
        .page.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .elo-card {
            position: relative;
            background: linear-gradient(140deg, rgba(0,224,138,0.07), rgba(0,184,116,0.02) 45%, rgba(5,10,8,0.6));
            border: 1px solid var(--border-strong); border-radius: 22px;
            padding: 22px; margin-bottom: 14px; overflow: hidden;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(0,224,138,0.08);
        }
        .elo-card::before {
            content: ''; position: absolute; top: -60%; right: -30%;
            width: 260px; height: 260px;
            background: radial-gradient(circle, rgba(0,224,138,0.18), transparent 65%);
            border-radius: 50%;
            animation: orbFloat 14s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes orbFloat { 0% { transform: translate(0, 0) scale(1); opacity: 0.85; } 100% { transform: translate(-20px, 20px) scale(1.12); opacity: 1; } }
        .elo-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--emerald); opacity: 0.65; margin-bottom: 6px; font-weight: 600; }
        .elo-value {
            font-size: 54px; font-weight: 900; line-height: 1;
            background: linear-gradient(180deg, #ffffff, var(--emerald-3));
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .elo-level { display: inline-block; background: rgba(0,224,138,0.08); border: 1px solid var(--border-strong); color: var(--emerald); padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-top: 10px; }
        .elo-progress { margin-top: 18px; height: 6px; background: rgba(0,224,138,0.06); border-radius: 3px; overflow: hidden; }
        .elo-progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--emerald-2), var(--emerald), var(--emerald-3));
            border-radius: 3px;
            transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 0 8px rgba(0,224,138,0.35);
        }
        .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .stat-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 14px 8px; text-align: center;
        }
        .stat-value { font-size: 22px; font-weight: 800; color: var(--emerald); }
        .stat-label { font-size: 10px; color: var(--hint); margin-top: 3px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .play-btn {
            position: relative; width: 100%; padding: 18px;
            border: none; border-radius: 18px;
            background: linear-gradient(135deg, #00e08a, #00b874 55%, #22e8a4);
            background-size: 200% 200%; color: #04140e;
            font-size: 17px; font-weight: 900; letter-spacing: 2px;
            cursor: pointer; margin-bottom: 18px;
            box-shadow: 0 6px 22px rgba(0,224,138,0.22), inset 0 1px 0 rgba(255,255,255,0.3);
        }
        .play-btn:active { transform: scale(0.97); }
        .play-btn:disabled { opacity: 0.55; }
        .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--hint); margin: 4px 0 12px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-strong), transparent); }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .menu-item {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 15px;
            display: flex; align-items: center; gap: 10px;
            cursor: pointer; color: var(--text); font-size: 13px; font-weight: 700;
        }
        .menu-item:active { transform: scale(0.97); border-color: var(--border-strong); }
        .menu-icon { font-size: 18px; }
        .leaderboard-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px; background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; margin-bottom: 8px;
        }
        .lb-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            background: linear-gradient(135deg, var(--emerald), var(--emerald-2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 12px; color: #04140e;
            overflow: hidden; flex-shrink: 0;
        }
        .lb-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .leaderboard-rank { font-size: 14px; font-weight: 900; color: var(--emerald); width: 26px; text-align: center; }
        .leaderboard-name { flex: 1; font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .leaderboard-elo { font-size: 14px; font-weight: 800; color: var(--emerald); }
        .profile-header {
            position: relative;
            background: linear-gradient(140deg, rgba(0,224,138,0.08), rgba(0,184,116,0.02) 45%, rgba(5,10,8,0.6));
            border: 1px solid var(--border-strong); border-radius: 22px;
            padding: 24px 20px; margin-bottom: 14px; text-align: center; overflow: hidden;
        }
        .profile-avatar-wrap { position: relative; display: inline-block; margin-bottom: 14px; }
        .profile-avatar {
            width: 96px; height: 96px; border-radius: 50%;
            background: linear-gradient(135deg, var(--emerald), var(--emerald-2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 36px; color: #04140e; overflow: hidden;
            box-shadow: 0 0 0 3px rgba(0,224,138,0.20), 0 0 24px rgba(0,224,138,0.25);
        }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-edit-btn {
            position: absolute; bottom: 0; right: 0;
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--emerald); color: #04140e; border: 2px solid var(--bg);
            font-size: 15px; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .profile-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
        .profile-username { font-size: 13px; color: var(--hint); margin-bottom: 14px; }
        .profile-username span { color: var(--emerald); }
        .profile-fields { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; text-align: left; }
        .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--hint); font-weight: 700; margin-bottom: 6px; display: block; }
        .field-input {
            width: 100%; background: rgba(0,224,138,0.04); border: 1px solid var(--border);
            border-radius: 14px; padding: 14px 16px; font-size: 15px; color: var(--text);
            font-family: inherit; font-weight: 600; outline: none;
        }
        .field-input:focus { border-color: var(--border-strong); background: rgba(0,224,138,0.07); }
        .save-btn {
            width: 100%; padding: 16px; border: none; border-radius: 16px;
            background: linear-gradient(135deg, #00e08a, #00b874 55%, #22e8a4);
            color: #04140e; font-size: 15px; font-weight: 900; letter-spacing: 1.5px;
            cursor: pointer; margin-top: 16px;
        }
        .save-btn:active { transform: scale(0.97); }
        .save-btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .save-btn.secondary { background: rgba(0,224,138,0.1); color: var(--emerald); border: 1px solid var(--border-strong); }
        .save-btn.danger { background: rgba(255,84,112,0.1); color: var(--red); border: 1px solid rgba(255,84,112,0.3); }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            display: flex; justify-content: space-around;
            padding: 8px 0 14px;
            background: rgba(5, 8, 7, 0.78);
            backdrop-filter: blur(20px) saturate(140%);
            border-top: 1px solid var(--border); z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            background: none; border: none; color: var(--hint);
            font-size: 10px; font-weight: 600; cursor: pointer; padding: 6px 14px;
        }
        .nav-item.active { color: var(--emerald); }
        .nav-icon { font-size: 19px; }
        .loading { display: none; text-align: center; padding: 18px; color: var(--emerald); font-weight: 600; font-size: 13px; }
        .loading.active { display: block; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(0,224,138,0.12);
            border-top-color: var(--emerald);
            border-right-color: var(--emerald-3);
            border-radius: 50%; animation: spin 0.9s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast {
            position: fixed; bottom: 100px; left: 50%;
            transform: translateX(-50%) translateY(24px);
            background: rgba(10, 20, 16, 0.94); color: var(--text);
            padding: 12px 22px; border-radius: 14px;
            font-size: 13px; font-weight: 600; opacity: 0;
            transition: all 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
            pointer-events: none; border: 1px solid var(--border-strong);
            box-shadow: 0 8px 32px rgba(0,0,0,0.55); z-index: 200;
            max-width: 80vw; text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #avatarFileInput, #clubLogoFileInput { display: none; }
        .sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px); z-index: 300;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .sheet-overlay.active { opacity: 1; pointer-events: auto; }
        .sheet {
            position: fixed; left: 0; right: 0; bottom: 0;
            background: #0e1a16;
            border-top-left-radius: 22px; border-top-right-radius: 22px;
            border-top: 1px solid var(--border-strong);
            padding: 20px 20px 28px; z-index: 301;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            max-height: 85vh; overflow-y: auto;
        }
        .sheet.active { transform: translateY(0); }
        .sheet-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--emerald); margin-bottom: 14px; text-align: center; }
        .sheet-option {
            width: 100%; padding: 15px;
            background: rgba(0,224,138,0.05); border: 1px solid var(--border);
            border-radius: 14px; color: var(--text);
            font-size: 14px; font-weight: 600;
            margin-bottom: 8px; cursor: pointer;
            display: flex; align-items: center; gap: 12px;
        }
        .sheet-option:active { background: rgba(0,224,138,0.10); border-color: var(--border-strong); }
        .sheet-cancel {
            width: 100%; padding: 14px; background: transparent;
            border: 1px solid var(--border); border-radius: 14px;
            color: var(--hint); font-size: 13px; font-weight: 700;
            margin-top: 6px; cursor: pointer;
        }
        .friend-action {
            padding: 8px 14px; border-radius: 12px; border: none;
            font-size: 12px; font-weight: 700; cursor: pointer;
            font-family: inherit; flex-shrink: 0;
        }
        .friend-action.add { background: var(--emerald); color: #04140e; }
        .friend-action.pending { background: rgba(0,224,138,0.15); color: var(--emerald); }
        .friend-action.accept { background: var(--emerald); color: #04140e; }
        .friend-action.decline { background: rgba(255,84,112,0.15); color: var(--red); }
        .empty {
            text-align: center; padding: 24px 12px; color: var(--hint);
            font-size: 13px;
        }
        .club-card {
            background: linear-gradient(140deg, rgba(0,224,138,0.08), rgba(0,184,116,0.02) 45%, rgba(5,10,8,0.6));
            border: 1px solid var(--border-strong);
            border-radius: 22px; padding: 20px; margin-bottom: 14px;
            position: relative; overflow: hidden;
        }
        .club-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
        .club-logo {
            width: 72px; height: 72px; border-radius: 20px;
            background: linear-gradient(135deg, var(--emerald), var(--emerald-2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 26px; color: #04140e;
            overflow: hidden; flex-shrink: 0;
            box-shadow: 0 0 0 2px rgba(0,224,138,0.2), 0 0 16px rgba(0,224,138,0.2);
        }
        .club-logo img { width: 100%; height: 100%; object-fit: cover; }
        .club-name { font-size: 20px; font-weight: 800; }
        .club-tag { font-size: 12px; color: var(--emerald); font-weight: 700; margin-top: 3px; letter-spacing: 1px; }
        .club-desc { color: var(--hint); font-size: 13px; line-height: 1.5; margin-bottom: 14px; }

        /* CHAT */
        .chat-list-item {
            display: flex; align-items: center; gap: 12px;
            padding: 14px; background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; margin-bottom: 8px; cursor: pointer;
        }
        .chat-list-item:active { border-color: var(--border-strong); }
        .chat-list-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, var(--emerald), var(--emerald-2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 16px; color: #04140e;
            overflow: hidden; flex-shrink: 0;
        }
        .chat-list-avatar.square { border-radius: 14px; }
        .chat-list-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-list-info { flex: 1; min-width: 0; }
        .chat-list-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-list-preview { font-size: 12px; color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

        .chat-view {
            position: fixed; inset: 0; z-index: 400;
            background: var(--bg);
            display: none;
            flex-direction: column;
        }
        .chat-view.active { display: flex; }
        .chat-view-header {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px;
            background: rgba(5,8,7,0.9);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .chat-back-btn {
            background: none; border: none; color: var(--emerald);
            font-size: 22px; cursor: pointer; padding: 4px 8px;
            font-family: inherit;
        }
        .chat-view-title { font-size: 15px; font-weight: 700; flex: 1; min-width: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .chat-messages {
            flex: 1; overflow-y: auto;
            padding: 14px 12px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .chat-bubble {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }
        .chat-bubble.me {
            align-self: flex-end;
            background: linear-gradient(135deg, #00e08a, #00b874);
            color: #04140e;
            border-bottom-right-radius: 4px;
        }
        .chat-bubble.them {
            align-self: flex-start;
            background: rgba(0,224,138,0.08);
            border: 1px solid var(--border);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }
        .chat-bubble-author {
            font-size: 11px; font-weight: 700; color: var(--emerald);
            margin-bottom: 3px;
        }
        .chat-bubble-time {
            font-size: 10px; opacity: 0.6; margin-top: 4px; text-align: right;
        }
        .chat-input-bar {
            display: flex; gap: 8px; padding: 10px 12px;
            background: rgba(5,8,7,0.9);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .chat-input-bar input {
            flex: 1;
            background: rgba(0,224,138,0.05);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 12px 16px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }
        .chat-input-bar input:focus { border-color: var(--border-strong); }
        .chat-send-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--emerald); color: #04140e; border: none;
            font-size: 18px; cursor: pointer; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .chat-send-btn:active { transform: scale(0.9); }
        .chat-send-btn:disabled { opacity: 0.5; }
    </style>
</head>
<body>
    <header class="header">
        <div class="avatar" id="headerAvatar" onclick="switchPage('profile')">?</div>
        <div class="header-title">De1mos <span>Faceit</span></div>
        <button class="notif-btn" onclick="showToast('Уведомлений пока нет')">🔔</button>
    </header>

    <!-- ============ DASHBOARD ============ -->
    <div class="container page active" id="page-dashboard">
        <div class="elo-card">
            <div class="elo-label">Ваш рейтинг</div>
            <div class="elo-value" id="eloValue">—</div>
            <div class="elo-level" id="eloLevel">Уровень —</div>
            <div class="elo-progress">
                <div class="elo-progress-bar" id="eloProgress"></div>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card"><div class="stat-value" id="statMatches">—</div><div class="stat-label">Матчей</div></div>
            <div class="stat-card"><div class="stat-value" id="statWins">—</div><div class="stat-label">Побед</div></div>
            <div class="stat-card"><div class="stat-value" id="statWinrate">—</div><div class="stat-label">Winrate</div></div>
        </div>

        <button class="play-btn" id="playBtn" onclick="findMatch()">🎮 ИГРАТЬ</button>
        <div class="loading" id="loading"><div class="spinner"></div><div>ПОИСК МАТЧА...</div></div>

        <div class="section-title">Быстрые действия</div>
        <div class="menu-grid">
            <button class="menu-item" onclick="openFriendsPage()">

        function compressImage(file, maxSize, quality) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const reader = new FileReader();
                reader.onload = (e) => { img.src = e.target.result; };
                reader.onerror = reject;
                img.onerror = reject;
                img.onload = () => {
                    let { width, height } = img;
                    if (width > height) {
                        if (width > maxSize) { height = Math.round(height * maxSize / width); width = maxSize; }
                    } else {
                        if (height > maxSize) { width = Math.round(width * maxSize / height); height = maxSize; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    canvas.toBlob(
                        (blob) => blob ? resolve(blob) : reject(new Error('Сжатие не удалось')),
                        'image/jpeg', quality
                    );
                };
                reader.readAsDataURL(file);
            });
        }

                    .select('requester_id, addressee_id, status')
                    .or(`requester_id.eq.${currentUser.telegram_id},addressee_id.eq.${currentUser.telegram_id}`);

                (rels || []).forEach(r => {
                    const other = r.requester_id === currentUser.telegram_id ? r.addressee_id : r.requester_id;

                    const otherId = r.requester_id === me ? r.addressee_id : r.requester_id;
                    const u = userMap[otherId] || { telegram_id: otherId, display_name: 'Игрок', elo: 1000 };
                    const item = { ...r, other: u };
                    if (r.status === 'accepted') accepted.push(item);
                    else if (r.status === 'pending' && r.requester_id !== me) incoming.push(item);
                    else if (r.status === 'pending' && r.requester_id === me) outgoing.push(item);
                });

                let html = '';
                if (incoming.length) {
                    html += '<div class="section-title" style="margin-top:0;">Входящие</div>';
                    html += incoming.map(r => renderFriendItem(r, 'incoming')).join('');
                }
                if (accepted.length) {
                    html += '<div class="section-title">Друзья (' + accepted.length + ')</div>';
                    html += accepted.map(r => renderFriendItem(r, 'friend')).join('');
                }
                if (outgoing.length) {
                    html += '<div class="section-title">Исходящие</div>';
                    html += outgoing.map(r => renderFriendItem(r, 'outgoing')).join('');
                }
                container.innerHTML = html || '<div class="empty">Пока нет друзей</div>';
            } catch (e) {
                container.innerHTML = '<div class="empty" style="color:var(--red);">Ошибка</div>';
            }
        }

        function renderFriendItem(item, mode) {
            const u = item.other;
            const src = u.custom_avatar || u.photo_url;
            const initial = (u.display_name || 'U')[0].toUpperCase();
            const av = src ? `<img src="${src}" alt="">` : initial;
            let actions = '';
            if (mode === 'friend') {
                actions = `<button class="friend-action decline" onclick="removeFriend(${item.id}, this)">✕</button>`;
            } else if (mode === 'outgoing') {
                actions = `<button class="friend-action decline" onclick="removeFriend(${item.id}, this)">Отмена</button>`;
            } else {
                actions = `
                    <button class="friend-action accept" onclick="acceptFriend(${item.id}, this)">✓</button>
                    <button class="friend-action decline" onclick="removeFriend(${item.id}, this)">✕</button>`;
            }
            return `
                <div class="leaderboard-item">
                    <div class="lb-avatar">${av}</div>
                    <div style="flex:1;min-width:0;">
                        <div class="leaderboard-name">${escapeHtml(u.display_name || 'Игрок')}</div>
                        <div style="font-size:11px;color:var(--hint);">${u.username ? '@' + u.username + ' · ' : ''}ELO ${u.elo}</div>
                    </div>
                    <div style="display:flex;gap:6px;">${actions}</div>
                </div>`;
        }

        async function acceptFriend(id) {
            try { await sb.from('friendships').update({ status: 'accepted' }).eq('id', id); showToast('✅'); loadFriends(); }
            catch (e) { showToast('Ошибка'); }
        }
        async function removeFriend(id) {
            try { await sb.from('friendships').delete().eq('id', id); showToast('Удалено'); loadFriends(); }
            catch (e) { showToast('Ошибка'); }
        }

        // ============================================================
        // CLUB
        // ============================================================
        async function openClubPage() {
            switchPage('club');
            await loadClub();
            subscribeClubRealtime();
        }

        async function loadClub() {
            const container = document.getElementById('clubContent');
            container.innerHTML = '<div class="empty">Загрузка...</div>';
            try {
                const me = currentUser.telegram_id;

                // Ищем моё членство
                const { data: membership } = await sb.from('club_members')
                    .select('club_id, role').eq('telegram_id', me).maybeSingle();

                if (!membership) {
                    myClub = null;
                    renderNoClub(container);
                    return;
                }

                // Загружаем клуб + участников
                const { data: club, error: cErr } = await sb.from('clubs')
                    .select('*').eq('id', membership.club_id).single();
                if (cErr) throw cErr;

                const { data: members } = await sb.from('club_members')
                    .select('*').eq('club_id', club.id);

                const memberIds = (members || []).map(m => m.telegram_id);
                const { data: users } = await sb.from('users')
                    .select('telegram_id, display_name, username, custom_avatar, photo_url, elo')
                    .in('telegram_id', memberIds);
                const userMap = {}; (users || []).forEach(u => userMap[u.telegram_id] = u);

                myClub = { club, members: (members || []).map(m => ({ ...m, user: userMap[m.telegram_id] })) };
                myClub.club.role = membership.role;

                renderMyClub(container);
            } catch (e) {
                console.error(e);
                container.innerHTML = '<div class="empty" style="color:var(--red);">Ошибка загрузки</div>';
            }
        }

        function renderNoClub(container) {
            container.innerHTML = `
                <div class="profile-header">
                    <div style="font-size:64px;margin-bottom:14px;">🛡️</div>
                    <h3 style="margin-bottom:10px;">Вы не в клубе</h3>
                    <p style="color:var(--hint);font-size:13px;margin-bottom:20px;">
                        Создайте свой клуб или подайте заявку в существующий
                    </p>
                    <button class="save-btn" onclick="openCreateClubSheet()">➕ Создать клуб</button>
                    <button class="save-btn secondary" onclick="openClubSearch()">🔍 Найти клуб</button>
                </div>
                <div id="clubSearchResults"></div>
            `;
        }

        function renderMyClub(container) {
            const { club, members } = myClub;
            const isOwner = club.role === 'owner' || club.owner_id === currentUser.telegram_id;
            const logoSrc = club.logo_url;
            const logoHTML = logoSrc ? `<img src="${logoSrc}" alt="">` : club.tag.slice(0, 2).toUpperCase();

            let membersHTML = members.map(m => {
                const u = m.user || {};
                const src = u.custom_avatar || u.photo_url;
                const initial = (u.display_name || 'U')[0].toUpperCase();
                const av = src ? `<img src="${src}" alt="">` : initial;
                const roleTag = m.role === 'owner' ? ' <span style="color:var(--gold);font-size:10px;">OWNER</span>' : '';
                const kickBtn = (isOwner && m.role !== 'owner')
                    ? `<button class="friend-action decline" onclick="kickMember(${m.telegram_id})">Кик</button>`
                    : '';
                return `
                    <div class="leaderboard-item">
                        <div class="lb-avatar">${av}</div>
                        <div style="flex:1;min-width:0;">
                            <div class="leaderboard-name">${escapeHtml(u.display_name || 'Игрок')}${roleTag}</div>
                            <div style="font-size:11px;color:var(--hint);">ELO ${u.elo || 1000}</div>
                        </div>
                        ${kickBtn}
                    </div>
                `;
            }).join('');

            // Заявки — только для owner
            const requestsHTML = isOwner ? '<div id="clubRequestsBlock"></div>' : '';

            container.innerHTML = `
                <div class="club-card">
                    <div class="club-header">
                        <div class="club-logo" onclick="${isOwner ? 'openClubLogoSheet()' : ''}">${logoHTML}</div>
                        <div style="flex:1;min-width:0;">
                            <div class="club-name">${escapeHtml(club.name)}</div>
                            <div class="club-tag">[${escapeHtml(club.tag)}] · ${members.length}/${club.max_members}</div>
                        </div>
                    </div>
                    ${club.description ? `<div class="club-desc">${escapeHtml(club.description)}</div>` : ''}
                    ${isOwner ? `
                        <button class="save-btn secondary" onclick="openEditClubSheet()">✏️ Редактировать</button>
                    ` : ''}
                    <button class="save-btn danger" onclick="leaveClub()">🚪 Покинуть клуб</button>
                </div>

                ${requestsHTML}

                <div class="section-title">Состав (${members.length}/${club.max_members})</div>
                ${membersHTML}
            `;

            if (isOwner) loadClubRequests();
        }

        async function loadClubRequests() {
            const el = document.getElementById('clubRequestsBlock');
            if (!el) return;
            try {
                const { data: reqs } = await sb.from('club_requests')
                    .select('id, telegram_id, created_at')
                    .eq('club_id', myClub.club.id).eq('status', 'pending');
                if (!reqs?.length) { el.innerHTML = ''; return; }

                const ids = reqs.map(r => r.telegram_id);
                const { data: users } = await sb.from('users')
                    .select('telegram_id, display_name, username, custom_avatar, photo_url, elo')
                    .in('telegram_id', ids);
                const userMap = {}; (users || []).forEach(u => userMap[u.telegram_id] = u);

                el.innerHTML = `
                    <div class="section-title">Заявки (${reqs.length})</div>
                    ${reqs.map(r => {
                        const u = userMap[r.telegram_id] || {};
                        const src = u.custom_avatar || u.photo_url;
                        const initial = (u.display_name || 'U')[0].toUpperCase();
                        const av = src ? `<img src="${src}" alt="">` : initial;
                        return `
                            <div class="leaderboard-item">
                                <div class="lb-avatar">${av}</div>
                                <div style="flex:1;min-width:0;">
                                    <div class="leaderboard-name">${escapeHtml(u.display_name || 'Игрок')}</div>
                                    <div style="font-size:11px;color:var(--hint);">ELO ${u.elo || 1000}</div>
                                </div>
                                <button class="friend-action accept" onclick="acceptClubRequest(${r.id}, ${r.telegram_id})">✓</button>
                                <button class="friend-action decline" onclick="declineClubRequest(${r.id})">✕</button>
                            </div>`;
                    }).join('')}
                `;
            } catch (e) { console.error(e); }
        }

        async function acceptClubRequest(requestId, userId) {
            try {
                // Проверка лимита
                if (myClub.members.length >= myClub.club.max_members) {
                    showToast('Клуб заполнен (макс ' + myClub.club.max_members + ')');
                    return;
                }
                // Добавляем в участники
                await sb.from('club_members').insert({
                    club_id: myClub.club.id, telegram_id: userId, role: 'member'
                });
                // Обновляем статус заявки
                await sb.from('club_requests').update({ status: 'accepted' }).eq('id', requestId);
                showToast('✅ Принят');
                openClubPage();
            } catch (e) { showToast('Ошибка: ' + e.message); }
        }

        async function declineClubRequest(requestId) {
            try {
                await sb.from('club_requests').update({ status: 'declined' }).eq('id', requestId);
                showToast('Отклонено');
                loadClubRequests();
            } catch (e) { showToast('Ошибка'); }
        }

        async function kickMember(userId) {
            if (!confirm('Кикнуть этого игрока?')) return;
            try {
                await sb.from('club_members').delete()
                    .eq('club_id', myClub.club.id).eq('telegram_id', userId);
                showToast('Кикнут');
                openClubPage();
            } catch (e) { showToast('Ошибка'); }
        }

        async function leaveClub() {
            if (!confirm('Покинуть клуб?')) return;
            try {
                await sb.from('club_members').delete()
                    .eq('club_id', myClub.club.id).eq('telegram_id', currentUser.telegram_id);

                // Если владелец — удаляем клуб
                if (myClub.club.owner_id === currentUser.telegram_id) {
                    await sb.from('clubs').delete().eq('id', myClub.club.id);
                }
                showToast('Вы покинули клуб');
                myClub = null;
                openClubPage();
            } catch (e) { showToast('Ошибка'); }
        }

        // ==== Создание клуба ====
        function openCreateClubSheet() {
            const name = prompt('Название клуба (2-30 символов):');
            if (!name || name.length < 2 || name.length > 30) { if(name!==null) showToast('Неверная длина'); return; }
            const tag = prompt('Тег клуба (2-5 букв/цифр):');
            if (!tag || tag.length < 2 || tag.length > 5) { if(tag!==null) showToast('Неверный тег'); return; }
            const desc = prompt('Описание (необязательно):') || '';

            createClub(name, tag, desc);
        }

        async function createClub(name, tag, description) {
            try {
                showToast('Создание клуба...');
                const { data: club, error } = await sb.from('clubs').insert({
                    name, tag, description, owner_id: currentUser.telegram_id, max_members: 10
                }).select().single();
                if (error) throw error;

                await sb.from('club_members').insert({
                    club_id: club.id, telegram_id: currentUser.telegram_id, role: 'owner'
                });

                showToast('✅ Клуб создан!');
                openClubPage();
            } catch (e) {
                console.error(e);
                showToast('Ошибка: ' + e.message);
            }
        }

        // ==== Редактирование клуба ====
        function openEditClubSheet() {
            const name = prompt('Название:', myClub.club.name);
            if (name === null) return;
            const tag = prompt('Тег:', myClub.club.tag);
            if (tag === null) return;
            const desc = prompt('Описание:', myClub.club.description || '');
            if (desc === null) return;

            sb.from('clubs').update({ name, tag, description: desc }).eq('id', myClub.club.id)
                .then(() => { showToast('✅ Обновлено'); openClubPage(); });
        }

        // ==== Поиск клуба ====
        async function openClubSearch() {
            const query = prompt('Поиск клуба (название или тег):');
            if (!query || query.length < 2) return;
            try {
                const safe = query.replace(/[%_]/g, '');
                const { data, error } = await sb.from('clubs')
                    .select('id, name, tag, description, logo_url, max_members')
                    .or(`name.ilike.%${safe}%,tag.ilike.%${safe}%`)
                    .limit(20);
                if (error) throw error;

                const container = document.getElementById('clubSearchResults');
                if (!data?.length) {
                    container.innerHTML = '<div class="empty">Ничего не найдено</div>';
                    return;
                }

                // Узнаем, куда уже отправлены заявки
                const clubIds = data.map(c => c.id);
                const { data: myReqs } = await sb.from('club_requests')
                    .select('club_id, status').eq('telegram_id', currentUser.telegram_id)
                    .in('club_id', clubIds);
                const reqMap = {}; (myReqs || []).forEach(r => reqMap[r.club_id] = r.status);

                container.innerHTML = '<div class="section-title">Найденные клубы</div>' + data.map(c => {
                    const logoSrc = c.logo_url;
                    const logoHTML = logoSrc ? `<img src="${logoSrc}" alt="">` : c.tag.slice(0, 2).toUpperCase();
                    const status = reqMap[c.id];
                    let btn;
                    if (status === 'pending') btn = `<button class="friend-action pending" disabled>⏳ Заявка</button>`;
                    else if (status === 'accepted') btn = `<button class="friend-action pending" disabled>✓ Принят</button>`;
                    else btn = `<button class="friend-action add" onclick="sendClubRequest(${c.id}, this)">+ Заявка</button>`;
                    return `
                        <div class="leaderboard-item">
                            <div class="lb-avatar" style="border-radius:14px;">${logoHTML}</div>
                            <div style="flex:1;min-width:0;">
                                <div class="leaderboard-name">${escapeHtml(c.name)}</div>
                                <div style="font-size:11px;color:var(--hint);">[${escapeHtml(c.tag)}] · до ${c.max_members}</div>
                            </div>
                            ${btn}
                        </div>`;
                }).join('');
            } catch (e) {
                showToast('Ошибка поиска');
            }
        }

        async function sendClubRequest(clubId, btnEl) {
            if (btnEl) { btnEl.disabled = true; btnEl.textContent = '...'; }
            try {
                await sb.from('club_requests').upsert({
                    club_id: clubId, telegram_id: currentUser.telegram_id, status: 'pending'
                }, { onConflict: 'club_id,telegram_id' });
                showToast('✅ Заявка отправлена');
                if (btnEl) { btnEl.className = 'friend-action pending'; btnEl.textContent = '⏳ Заявка'; }
            } catch (e) {
                showToast('Ошибка: ' + e.message);
                if (btnEl) { btnEl.disabled = false; btnEl.textContent = '+ Заявка'; }
            }
        }

        // ==== Realtime для клуба ====
        function subscribeClubRealtime() {
            if (!currentUser) return;
            if (clubChannel) sb.removeChannel(clubChannel);

            clubChannel = sb.channel('club_rt_' + currentUser.telegram_id)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'club_members' }, () => {
                    if (document.getElementById('page-club').classList.contains('active')) loadClub();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'club_requests' }, () => {
                    if (document.getElementById('page-club').classList.contains('active')) loadClub();
                })
                .subscribe();
        }

        // ============================================================
        // CHAT
        // ============================================================
        function openChatPage() {
            switchPage('chat');
            loadChatList();
        }

        async function loadChatList() {
            if (!currentUser) return;
            const container = document.getElementById('chatList');
            container.innerHTML = '<div class="empty">Загрузка...</div>';
            try {
                const me = currentUser.telegram_id;
                const items = [];

                // Клубный чат (если в клубе)
                const { data: membership } = await sb.from('club_members')
                    .select('club_id').eq('telegram_id', me).maybeSingle();
                if (membership) {
                    const { data: club } = await sb.from('clubs')
                        .select('id, name, tag, logo_url').eq('id', membership.club_id).single();
                    if (club) {
                        const { data: lastMsg } = await sb.from('messages')
                            .select('text, created_at, sender_id')
                            .eq('club_id', club.id)
                            .order('created_at', { ascending: false }).limit(1).maybeSingle();

                        items.push({
                            type: 'club', id: club.id, name: club.name + ' [' + club.tag + ']',
                            avatar: club.logo_url, square: true,
                            preview: lastMsg?.text || 'Чат клуба'
                        });
                    }
                }

                // Личные чаты (по друзьям)
                const { data: friends } = await sb.from('friendships')
                    .select('requester_id, addressee_id, status')
                    .or(`requester_id.eq.${me},addressee_id.eq.${me}`)
                    .eq('status', 'accepted');

                const friendIds = (friends || []).map(f => f.requester_id === me ? f.addressee_id : f.requester_id);

                if (friendIds.length) {
                    const { data: users } = await sb.from('users')
                        .select('telegram_id, display_name, username, custom_avatar, photo_url')
                        .in('telegram_id', friendIds);
                    const userMap = {}; (users || []).forEach(u => userMap[u.telegram_id] = u);

                    for (const fid of friendIds) {
                        const u = userMap[fid] || { telegram_id: fid, display_name: 'Игрок' };
                        // последнее сообщение в диалоге
                        const { data: msgs } = await sb.from('messages')
                            .select('text, created_at, sender_id')
                            .or(`and(sender_id.eq.${me},recipient_id.eq.${fid}),and(sender_id.eq.${fid},recipient_id.eq.${me})`)
                            .order('created_at', { ascending: false }).limit(1);
                        const last = msgs?.[0];
                        items.push({
                            type: 'dm', id: fid,
                            name: u.display_name || 'Игрок',
                            avatar: u.custom_avatar || u.photo_url,
                            square: false,
                            preview: last?.text || 'Начать чат'
                        });
                    }
                }

                if (!items.length) {
                    container.innerHTML = '<div class="empty">Нет чатов. Добавьте друзей или вступите в клуб.</div>';
                    return;
                }

                container.innerHTML = items.map(it => {
                    const av = it.avatar ? `<img src="${it.avatar}" alt="">` : (it.name[0] || '?').toUpperCase();
                    const square = it.square ? ' square' : '';
                    return `
                        <div class="chat-list-item" onclick="openChat('${it.type}', ${it.id})">
                            <div class="chat-list-avatar${square}">${av}</div>
                            <div class="chat-list-info">
                                <div class="chat-list-name">${escapeHtml(it.name)}</div>
                                <div class="chat-list-preview">${escapeHtml(it.preview)}</div>
                            </div>
                        </div>`;
                }).join('');
            } catch (e) {
                console.error(e);
                container.innerHTML = '<div class="empty" style="color:var(--red);">Ошибка</div>';
            }
        }

        async function openChat(type, id) {
            try {
                if (type === 'club') {
                    const { data: club } = await sb.from('clubs')
                        .select('id, name, tag, logo_url').eq('id', id).single();
                    currentChat = { type: 'club', id: club.id, name: club.name + ' [' + club.tag + ']', avatar: club.logo_url };
                } else {
                    const { data: u } = await sb.from('users')
                        .select('telegram_id, display_name, custom_avatar, photo_url').eq('telegram_id', id).single();
                    currentChat = { type: 'dm', id: u.telegram_id, name: u.display_name || 'Игрок', avatar: u.custom_avatar || u.photo_url };
                }

                document.getElementById('chatViewTitle').textContent = currentChat.name;
                const avEl = document.getElementById('chatViewAvatar');
                avEl.className = 'chat-list-avatar' + (currentChat.type === 'club' ? ' square' : '');
                avEl.innerHTML = currentChat.avatar ? `<img src="${currentChat.avatar}" alt="">` : (currentChat.name[0] || '?').toUpperCase();

                document.getElementById('chatView').classList.add('active');
                document.getElementById('chatMessages').innerHTML = '';

                await loadMessages();
                subscribeChatRealtime();
            } catch (e) {
                console.error(e);
                showToast('Ошибка чата');
            }
        }

        function closeChatView() {
            document.getElementById('chatView').classList.remove('active');
            if (chatChannel) { sb.removeChannel(chatChannel); chatChannel = null; }
            currentChat = null;
            openChatPage();
        }

        async function loadMessages() {
            if (!currentChat || !currentUser) return;
            const me = currentUser.telegram_id;
            const container = document.getElementById('chatMessages');

            let query;
            if (currentChat.type === 'club') {
                query = sb.from('messages')
                    .select('id, sender_id, text, image_url, created_at')
                    .eq('club_id', currentChat.id)
                    .order('created_at', { ascending: true }).limit(200);
            } else {
                query = sb.from('messages')
                    .select('id, sender_id, text, image_url, created_at')
                    .or(`and(sender_id.eq.${me},recipient_id.eq.${currentChat.id}),and(sender_id.eq.${currentChat.id},recipient_id.eq.${me})`)
                    .order('created_at', { ascending: true }).limit(200);
            }

            const { data, error } = await query;
            if (error) { console.error(error); return; }

            // Подтягиваем профили отправителей
            const senderIds = [...new Set((data || []).map(m => m.sender_id))];
            const { data: users } = await sb.from('users')
                .select('telegram_id, display_name, custom_avatar, photo_url')
                .in('telegram_id', senderIds.length ? senderIds : [0]);
            const userMap = {}; (users || []).forEach(u => userMap[u.telegram_id] = u);

            container.innerHTML = (data || []).map(m => renderBubble(m, userMap[m.sender_id], me)).join('');
            container.scrollTop = container.scrollHeight;
        }

        function renderBubble(msg, user, me) {
            const isMe = msg.sender_id === me;
            const cls = isMe ? 'me' : 'them';
            const time = new Date(msg.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            const author = (!isMe && currentChat.type === 'club')
                ? `<div class="chat-bubble-author">${escapeHtml(user?.display_name || 'Игрок')}</div>`
                : '';
            return `
                <div class="chat-bubble ${cls}">
                    ${author}
                    <div>${escapeHtml(msg.text || '')}</div>
                    <div class="chat-bubble-time">${time}</div>
                </div>`;
        }

        async function sendMessage() {
            if (!currentChat || !currentUser) return;
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            try {
                const payload = {
                    sender_id: currentUser.telegram_id,
                    text,
                    club_id: currentChat.type === 'club' ? currentChat.id : null,
                    recipient_id: currentChat.type === 'dm' ? currentChat.id : null
                };
                const { error } = await sb.from('messages').insert(payload);
                if (error) throw error;
                // Realtime должен подхватить и отобразить
            } catch (e) {
                console.error(e);
                showToast('Ошибка отправки');
            }
        }

        document.getElementById('chatInput')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
        });

        function subscribeChatRealtime() {
            if (!currentChat) return;
            if (chatChannel) sb.removeChannel(chatChannel);

            const me = currentUser.telegram_id;
            const filter = currentChat.type === 'club'
                ? `club_id=eq.${currentChat.id}`
                : `recipient_id=eq.${me}`; // грубо, но работает: фильтр по recipient

            chatChannel = sb.channel('chat_' + currentChat.type + '_' + currentChat.id)
                .on('postgres_changes', {
                    event: 'INSERT', schema: 'public', table: 'messages'
                }, (payload) => {
                    const m = payload.new;
                    // Фильтрация на клиенте
                    if (currentChat.type === 'club') {
                        if (m.club_id !== currentChat.id) return;
                    } else {
                        const isForMe = m.recipient_id === me && m.sender_id === currentChat.id;
                        const isFromMe = m.sender_id === me && m.recipient_id === currentChat.id;
                        if (!isForMe && !isFromMe) return;
                    }
                    appendMessage(m);
                })
                .subscribe();
        }

        async function appendMessage(m) {
            const container = document.getElementById('chatMessages');
            if (!container) return;
            // Подтянем автора
            let user = null;
            if (m.sender_id !== currentUser.telegram_id) {
                const { data } = await sb.from('users')
                    .select('telegram_id, display_name, custom_avatar, photo_url')
                    .eq('telegram_id', m.sender_id).single();
                user = data;
            }
            container.insertAdjacentHTML('beforeend', renderBubble(m, user, currentUser.telegram_id));
            container.scrollTop = container.scrollHeight;
        }

        // ============================================================
        // HELPERS
        // ============================================================
        function haptic(style = 'light') {
            try { tg?.HapticFeedback?.impactOccurred(style); } catch (e) {}
        }

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        let toastTimer;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        init();
    </script>
</body>
</html>
