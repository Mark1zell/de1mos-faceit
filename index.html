<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>De1mos Faceit</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #050807;
            --card: rgba(16, 28, 24, 0.72);
            --border: rgba(0, 255, 156, 0.10);
            --border-strong: rgba(0, 255, 156, 0.22);
            --emerald: #00e08a;
            --emerald-2: #00b874;
            --emerald-3: #22e8a4;
            --text: #e6f5ee;
            --hint: #6d8a80;
            --red: #ff5470;
            --gold: #d9ab5a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
        }
        body::before {
            content: ''; position: fixed; inset: -50%;
            background:
                radial-gradient(circle at 20% 20%, rgba(0,224,138,0.08), transparent 45%),
                radial-gradient(circle at 80% 60%, rgba(0,184,116,0.06), transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(34,232,164,0.05), transparent 55%);
            animation: bgFloat 24s ease-in-out infinite alternate;
            z-index: -2; filter: blur(30px); will-change: transform;
        }
        body::after {
            content: ''; position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(0,224,138,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,224,138,0.025) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at 50% 30%, #000 15%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at 50% 30%, #000 15%, transparent 70%);
            z-index: -1; pointer-events: none;
        }
        @keyframes bgFloat { 0% { transform: translate3d(0, 0, 0) scale(1); } 100% { transform: translate3d(2%, -2%, 0) scale(1.06); } }
        .header {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px;
            background: rgba(5, 8, 7, 0.65);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border-bottom: 1px solid var(--border);
        }
        .avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, var(--emerald), var(--emerald-2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 15px; color: #04140e;
            overflow: hidden;
            box-shadow: 0 0 0 1.5px rgba(0,224,138,0.18), 0 0 12px rgba(0,224,138,0.18);
            animation: pulseGlow 5s ease-in-out infinite; cursor: pointer;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 1.5px rgba(0,224,138,0.18), 0 0 12px rgba(0,224,138,0.18); }
            50% { box-shadow: 0 0 0 1.5px rgba(0,224,138,0.28), 0 0 18px rgba(0,224,138,0.28); }
        }
        .header-title {
            font-size: 17px; font-weight: 800; letter-spacing: 0.6px;
            background: linear-gradient(90deg, #e6f5ee 0%, var(--emerald) 50%, #e6f5ee 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 6s linear infinite;
        }
        .header-title span { -webkit-text-fill-color: var(--emerald); }
        @keyframes shine { 0% { background-position: 0% center; } 100% { background-position: -200% center; } }
        .notif-btn {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(0,224,138,0.06); border: 1px solid var(--border);
            color: var(--emerald); font-size: 17px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .notif-btn:active { transform: scale(0.9); background: rgba(0,224,138,0.14); }
        .container { padding: 18px 16px 100px; }
        .page { display: none; animation: fadeUp 0.4s cubic-bezier(0.2, 0.7, 0.2, 1); }
        .page.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .elo-card {
            position: relative;
            background: linear-gradient(140deg, rgba(0,224,138,0.07), rgba(0,184,116,0.02) 45%, rgba(5,10,8,0.6));
            border: 1px solid var(--border-strong); border-radius: 22px;
            padding: 22px; margin-bottom: 14px; overflow: hidden;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(0,224,138,0.08);
        }
        .elo-card::before {
            content: ''; position: absolute; top: -60%; right: -30%;
            width: 260px; height: 260px;
            background: radial-gradient(circle, rgba(0,224,138,0.18), transparent 65%);
            border-radius: 50%;
            animation: orbFloat 14s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes orbFloat { 0% { transform: translate(0, 0) scale(1); opacity: 0.85; } 100% { transform: translate(-20px, 20px) scale(1.12); opacity: 1; } }
        .elo-label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--emerald); opacity: 0.65; margin-bottom: 6px; font-weight: 600; }
        .elo-value {
            font-size: 54px; font-weight: 900; line-height: 1;
            background: linear-gradient(180deg, #ffffff, var(--emerald-3));
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .elo-level { display: inline-block; background: rgba(0,224,138,0.08); border: 1px solid var(--border-strong); color: var(--emerald); padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-top: 10px; }
        .elo-progress { margin-top: 18px; height: 6px; background: rgba(0,224,138,0.06); border-radius: 3px; overflow: hidden; }
        .elo-progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--emerald-2), var(--emerald), var(--emerald-3));
            border-radius: 3px;
            transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 0 8px rgba(0,224,138,0.35);
        }
        .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .stat-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 14px 8px; text-align: center;
        }
        .stat-value { font-size: 22px; font-weight: 800; color: var(--emerald); }
        .stat-label { font-size: 10px; color: var(--hint); margin-top: 3px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .play-btn {
            position: relative; width: 100%; padding: 18px;
            border: none; border-radius: 18px;
            background: linear-gradient(135deg, #00e08a, #00b874 55%, #22e8a4);
            background-size: 200% 200%; color: #04140e;
            font-size: 17px; font-weight: 900; letter-spacing: 2px;
            cursor: pointer; margin-bottom: 18px;
            box-shadow: 0 6px 22px rgba(0,224,138,0.22), inset 0 1px 0 rgba(255,255,255,0.3);
        }
        .play-btn:active { transform: scale(0.97); }
        .play-btn:disabled { opacity: 0.55; }
        .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--hint); margin: 4px 0 12px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-strong), transparent); }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .menu-item {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 15px;
            display: flex; align-items: center; gap: 10px;
            cursor: pointer; color: var(--text); font-size: 13px; font-weight: 700;
        }
        .menu-item:active { transform: scale(0.97); border-color: var(--border-strong); }
        .menu-icon { font-size: 18px; }
        .leaderboard-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px; background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; margin-bottom: 8px;
        }
        .lb-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            background: linear-gradient(135deg, var(--emerald), var(--emerald-2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 12px; color: #04140e;
            overflow: hidden; flex-shrink: 0;
        }
        .lb-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .leaderboard-rank { font-size: 14px; font-weight: 900; color: var(--emerald); width: 26px; text-align: center; }
        .leaderboard-name { flex: 1; font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .leaderboard-elo { font-size: 14px; font-weight: 800; color: var(--emerald); }
        .profile-header {
            position: relative;
            background: linear-gradient(140deg, rgba(0,224,138,0.08), rgba(0,184,116,0.02) 45%, rgba(5,10,8,0.6));
            border: 1px solid var(--border-strong); border-radius: 22px;
            padding: 24px 20px; margin-bottom: 14px; text-align: center; overflow: hidden;
        }
        .profile-avatar-wrap { position: relative; display: inline-block; margin-bottom: 14px; }
        .profile-avatar {
            width: 96px; height: 96px; border-radius: 50%;
            background: linear-gradient(135deg, var(--emerald), var(--emerald-2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 36px; color: #04140e; overflow: hidden;
            box-shadow: 0 0 0 3px rgba(0,224,138,0.20), 0 0 24px rgba(0,224,138,0.25);
        }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-edit-btn {
            position: absolute; bottom: 0; right: 0;
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--emerald); color: #04140e; border: 2px solid var(--bg);
            font-size: 15px; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .profile-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
        .profile-username { font-size: 13px; color: var(--hint); margin-bottom: 14px; }
        .profile-username span { color: var(--emerald); }
        .profile-fields { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; text-align: left; }
        .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--hint); font-weight: 700; margin-bottom: 6px; display: block; }
        .field-input {
            width: 100%; background: rgba(0,224,138,0.04); border: 1px solid var(--border);
            border-radius: 14px; padding: 14px 16px; font-size: 15px; color: var(--text);
            font-family: inherit; font-weight: 600; outline: none;
        }
        .field-input:focus { border-color: var(--border-strong); background: rgba(0,224,138,0.07); }
        .save-btn {
            width: 100%; padding: 16px; border: none; border-radius: 16px;
            background: linear-gradient(135deg, #00e08a, #00b874 55%, #22e8a4);
            color: #04140e; font-size: 15px; font-weight: 900; letter-spacing: 1.5px;
            cursor: pointer; margin-top: 16px;
        }
        .save-btn:active { transform: scale(0.97); }
        .save-btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            display: flex; justify-content: space-around;
            padding: 8px 0 14px;
            background: rgba(5, 8, 7, 0.78);
            backdrop-filter: blur(20px) saturate(140%);
            border-top: 1px solid var(--border); z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            background: none; border: none; color: var(--hint);
            font-size: 10px; font-weight: 600; cursor: pointer; padding: 6px 14px;
        }
        .nav-item.active { color: var(--emerald); }
        .nav-icon { font-size: 19px; }
        .loading { display: none; text-align: center; padding: 18px; color: var(--emerald); font-weight: 600; font-size: 13px; }
        .loading.active { display: block; }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(0,224,138,0.12);
            border-top-color: var(--emerald);
            border-right-color: var(--emerald-3);
            border-radius: 50%; animation: spin 0.9s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast {
            position: fixed; bottom: 100px; left: 50%;
            transform: translateX(-50%) translateY(24px);
            background: rgba(10, 20, 16, 0.94); color: var(--text);
            padding: 12px 22px; border-radius: 14px;
            font-size: 13px; font-weight: 600; opacity: 0;
            transition: all 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
            pointer-events: none; border: 1px solid var(--border-strong);
            box-shadow: 0 8px 32px rgba(0,0,0,0.55); z-index: 200; white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #avatarFileInput { display: none; }
        .sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px); z-index: 300;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .sheet-overlay.active { opacity: 1; pointer-events: auto; }
        .sheet {
            position: fixed; left: 0; right: 0; bottom: 0;
            background: #0e1a16;
            border-top-left-radius: 22px; border-top-right-radius: 22px;
            border-top: 1px solid var(--border-strong);
            padding: 20px 20px 28px; z-index: 301;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .sheet.active { transform: translateY(0); }
        .sheet-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--emerald); margin-bottom: 14px; text-align: center; }
        .sheet-option {
            width: 100%; padding: 15px;
            background: rgba(0,224,138,0.05); border: 1px solid var(--border);
            border-radius: 14px; color: var(--text);
            font-size: 14px; font-weight: 600;
            margin-bottom: 8px; cursor: pointer;
            display: flex; align-items: center; gap: 12px;
        }
        .sheet-option:active { background: rgba(0,224,138,0.10); border-color: var(--border-strong); }
        .sheet-cancel {
            width: 100%; padding: 14px; background: transparent;
            border: 1px solid var(--border); border-radius: 14px;
            color: var(--hint); font-size: 13px; font-weight: 700;
            margin-top: 6px; cursor: pointer;
        }
        .friend-action {
            padding: 8px 14px; border-radius: 12px; border: none;
            font-size: 12px; font-weight: 700; cursor: pointer;
            font-family: inherit; flex-shrink: 0;
        }
        .friend-action.add { background: var(--emerald); color: #04140e; }
        .friend-action.pending { background: rgba(0,224,138,0.15); color: var(--emerald); }
        .friend-action.accept { background: var(--emerald); color: #04140e; }
        .friend-action.decline { background: rgba(255,84,112,0.15); color: var(--red); }
        .empty {
            text-align: center; padding: 24px 12px; color: var(--hint);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="avatar" id="headerAvatar" onclick="switchPage('profile')">?</div>
        <div class="header-title">De1mos <span>Faceit</span></div>
        <button class="notif-btn" onclick="showToast('Уведомлений пока нет')">🔔</button>
    </header>

    <!-- ============ DASHBOARD ============ -->
    <div class="container page active" id="page-dashboard">
        <div class="elo-card">
            <div class="elo-label">Ваш рейтинг</div>
            <div class="elo-value" id="eloValue">—</div>
            <div class="elo-level" id="eloLevel">Уровень —</div>
            <div class="elo-progress">
                <div class="elo-progress-bar" id="eloProgress"></div>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card"><div class="stat-value" id="statMatches">—</div><div class="stat-label">Матчей</div></div>
            <div class="stat-card"><div class="stat-value" id="statWins">—</div><div class="stat-label">Побед</div></div>
            <div class="stat-card"><div class="stat-value" id="statWinrate">—</div><div class="stat-label">Winrate</div></div>
        </div>

        <button class="play-btn" id="playBtn" onclick="findMatch()">🎮 ИГРАТЬ</button>
        <div class="loading" id="loading"><div class="spinner"></div><div>ПОИСК МАТЧА...</div></div>

        <div class="section-title">Быстрые действия</div>
        <div class="menu-grid">
            <button class="menu-item" onclick="openFriendsPage()">
                <span class="menu-icon">👥</span> Друзья
            </button>
            <button class="menu-item" onclick="showToast('Раздел в разработке')">
                <span class="menu-icon">🏆</span> Клубы
            </button>
            <button class="menu-item" onclick="showToast('Раздел в разработке')">
                <span class="menu-icon">📊</span> Статистика
            </button>
            <button class="menu-item" onclick="showToast('Раздел в разработке')">
                <span class="menu-icon">💬</span> Чат
            </button>
        </div>

        <div class="section-title">Лидерборд</div>
        <div id="leaderboard"><div class="empty">Загрузка...</div></div>
    </div>

    <!-- ============ PROFILE ============ -->
    <div class="container page" id="page-profile">
        <div class="profile-header">
            <div class="profile-avatar-wrap">
                <div class="profile-avatar" id="profileAvatar">?</div>
                <button class="avatar-edit-btn" onclick="openAvatarSheet()">✎</button>
            </div>
            <div class="profile-name" id="profileName">—</div>
            <div class="profile-username" id="profileUsername">@—</div>

            <div class="profile-fields">
                <div>
                    <label class="field-label">Никнейм</label>
                    <input type="text" class="field-input" id="nicknameInput" placeholder="Введите ваш никнейм" maxlength="32" autocomplete="off">
                </div>
                <div>
                    <label class="field-label">Standoff 2 ID</label>
                    <input type="text" class="field-input" id="standoffIdInput" placeholder="Введите ваш ID из Standoff 2" maxlength="64" autocomplete="off">
                </div>
            </div>

            <button class="save-btn" id="saveBtn" onclick="saveProfile()">💾 СОХРАНИТЬ</button>
        </div>
    </div>

    <!-- ============ FRIENDS ============ -->
    <div class="container page" id="page-friends">
        <div class="profile-header">
            <h3 style="margin-bottom: 14px;">🔍 Поиск друзей</h3>
            <div style="display: flex; gap: 8px;">
                <input type="text" class="field-input" id="friendSearchInput" placeholder="Никнейм или @username" autocomplete="off">
                <button class="save-btn" style="width: auto; padding: 14px 18px; margin: 0;" onclick="searchFriends()">Найти</button>
            </div>
            <div id="friendSearchResults" style="margin-top: 14px;"></div>
        </div>

        <div class="profile-header">
            <h3 style="margin-bottom: 14px;">👥 Мои друзья</h3>
            <div id="friendsList" style="margin-top: 14px;"></div>
        </div>
    </div>

    <!-- ============ NAV ============ -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-page="dashboard" onclick="switchPage('dashboard')">
            <span class="nav-icon">🏠</span><span>Главная</span>
        </button>
        <button class="nav-item" data-page="profile" onclick="switchPage('profile')">
            <span class="nav-icon">👤</span><span>Профиль</span>
        </button>
        <button class="nav-item" data-page="friends" onclick="openFriendsPage()">
            <span class="nav-icon">👥</span><span>Друзья</span>
        </button>
        <button class="nav-item" onclick="showToast('Раздел в разработке')">
            <span class="nav-icon">💬</span><span>Чат</span>
        </button>
    </nav>

    <div class="sheet-overlay" id="sheetOverlay" onclick="closeAvatarSheet()"></div>
    <div class="sheet" id="avatarSheet">
        <div class="sheet-title">Сменить аватар</div>
        <button class="sheet-option" onclick="pickFromTelegram()">
            <span style="font-size:18px;">📷</span> Фото из Telegram
        </button>
        <button class="sheet-option" onclick="pickFromGallery()">
            <span style="font-size:18px;">🖼️</span> Загрузить из галереи
        </button>
        <button class="sheet-option" onclick="removeAvatar()" style="color: var(--red);">
            <span style="font-size:18px;">🗑️</span> Удалить аватар
        </button>
        <button class="sheet-cancel" onclick="closeAvatarSheet()">ОТМЕНА</button>
    </div>

    <input type="file" id="avatarFileInput" accept="image/*">
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // НАСТРОЙКИ SUPABASE
        // ============================================================
        const SUPABASE_URL = 'https://mfvtdsgjejilajxxwbts.supabase.co';
        const SUPABASE_ANON_KEY = 'ВСТАВЬ_СЮДА_ТВОЙ_ANON_КЛЮЧ';
        const STORAGE_BUCKET = 'avatars';

        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // TELEGRAM
        // ============================================================
        const tg = window.Telegram?.WebApp;
        let currentUser = null;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        // ============================================================
        // INIT
        // ============================================================
        async function init() {
            if (!tg) {
                showToast('Откройте приложение через Telegram');
                return;
            }

            const user = tg.initDataUnsafe?.user;
            if (!user) {
                showToast('Не удалось получить данные Telegram');
                return;
            }

            setHeaderAvatar(user.photo_url, user.first_name);

            try {
                // Upsert — создаст или обновит запись
                const { data, error } = await sb
                    .from('users')
                    .upsert({
                        telegram_id: user.id,
                        username: user.username || null,
                        display_name: user.first_name || user.username || 'Игрок',
                        photo_url: user.photo_url || null
                    }, { onConflict: 'telegram_id' })
                    .select()
                    .single();

                if (error) throw error;

                currentUser = data;
                renderAll();
                loadLeaderboard();
            } catch (e) {
                console.error('Init error:', e);
                showToast('Ошибка загрузки профиля: ' + e.message);
            }
        }

        // ============================================================
        // RENDER
        // ============================================================
        function renderAll() {
            renderDashboard(currentUser);
            renderProfile(currentUser);
        }

        function renderDashboard(user) {
            const winrate = user.matches_played > 0
                ? Math.round((user.wins / user.matches_played) * 100)
                : 0;

            document.getElementById('eloValue').textContent = user.elo ?? 1000;
            document.getElementById('eloLevel').textContent = `Уровень ${user.level ?? 1}`;
            document.getElementById('statMatches').textContent = user.matches_played ?? 0;
            document.getElementById('statWins').textContent = user.wins ?? 0;
            document.getElementById('statWinrate').textContent = winrate + '%';

            const progress = ((user.elo ?? 1000) % 250) / 250 * 100;
            setTimeout(() => {
                document.getElementById('eloProgress').style.width = progress + '%';
            }, 200);
        }

        function renderProfile(user) {
            document.getElementById('profileName').textContent = user.display_name || 'Без имени';
            document.getElementById('profileUsername').innerHTML =
                user.username ? `@<span>${user.username}</span>` : '@—';
            document.getElementById('standoffIdInput').value = user.standoff_id || '';
            document.getElementById('nicknameInput').value = user.display_name || '';
            renderProfileAvatar(user);
        }

        function renderProfileAvatar(user) {
            const src = user.custom_avatar || user.photo_url;
            const initial = (user.display_name || 'U')[0].toUpperCase();

            const profileEl = document.getElementById('profileAvatar');
            if (src) profileEl.innerHTML = `<img src="${src}" alt="">`;
            else profileEl.textContent = initial;

            const headerEl = document.getElementById('headerAvatar');
            if (src) headerEl.innerHTML = `<img src="${src}" alt="">`;
            else headerEl.textContent = initial;
        }

        function setHeaderAvatar(photoUrl, firstName) {
            const el = document.getElementById('headerAvatar');
            if (photoUrl) el.innerHTML = `<img src="${photoUrl}" alt="">`;
            else el.textContent = (firstName || 'U')[0].toUpperCase();
        }

        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById('page-' + page);
            if (target) target.classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => {
                n.classList.toggle('active', n.dataset.page === page);
            });
            haptic();
        }

        // ============================================================
        // SAVE PROFILE
        // ============================================================
        async function saveProfile() {
            if (!currentUser) return;
            const btn = document.getElementById('saveBtn');
            const standoffId = document.getElementById('standoffIdInput').value.trim();
            const nickname = document.getElementById('nicknameInput').value.trim();

            if (!nickname) { showToast('Никнейм не может быть пустым'); return; }
            if (nickname.length > 32) { showToast('Никнейм слишком длинный'); return; }

            btn.disabled = true;
            btn.textContent = 'СОХРАНЕНИЕ...';

            try {
                const { data, error } = await sb
                    .from('users')
                    .update({
                        standoff_id: standoffId || null,
                        display_name: nickname
                    })
                    .eq('telegram_id', currentUser.telegram_id)
                    .select()
                    .single();

                if (error) throw error;

                currentUser = data;
                renderAll();
                showToast('✅ Профиль сохранён');
                haptic('medium');
            } catch (e) {
                console.error('Save error:', e);
                showToast('Ошибка сохранения');
            } finally {
                btn.disabled = false;
                btn.textContent = '💾 СОХРАНИТЬ';
            }
        }

        // ============================================================
        // AVATAR
        // ============================================================
        function openAvatarSheet() {
            document.getElementById('sheetOverlay').classList.add('active');
            document.getElementById('avatarSheet').classList.add('active');
            haptic();
        }
        function closeAvatarSheet() {
            document.getElementById('sheetOverlay').classList.remove('active');
            document.getElementById('avatarSheet').classList.remove('active');
        }

        function pickFromTelegram() {
            closeAvatarSheet();
            const user = tg?.initDataUnsafe?.user;
            if (user?.photo_url) uploadAvatarFromUrl(user.photo_url);
            else showToast('У вас нет фото в Telegram');
        }
        function pickFromGallery() {
            closeAvatarSheet();
            document.getElementById('avatarFileInput').click();
        }

        document.getElementById('avatarFileInput').addEventListener('change', async (e) => {
            const file = e.target.files?.[0];
            e.target.value = '';
            if (!file) return;
            if (file.size > 10_000_000) { showToast('Файл слишком большой (макс 10MB)'); return; }
            await uploadAvatarFile(file);
        });

        async function uploadAvatarFile(file) {
            if (!currentUser) return;
            showToast('Обработка...');
            try {
                const blob = await compressImage(file, 512, 0.85);
                const path = `${currentUser.telegram_id}/${Date.now()}.jpg`;

                const { error: upErr } = await sb.storage
                    .from(STORAGE_BUCKET)
                    .upload(path, blob, { contentType: 'image/jpeg', upsert: true });
                if (upErr) throw upErr;

                const { data: urlData } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(path);
                const publicUrl = urlData.publicUrl;

                const { data, error } = await sb
                    .from('users')
                    .update({ custom_avatar: publicUrl })
                    .eq('telegram_id', currentUser.telegram_id)
                    .select()
                    .single();
                if (error) throw error;

                currentUser = data;
                renderProfileAvatar(currentUser);
                showToast('✅ Аватар обновлён');
                haptic('medium');
            } catch (e) {
                console.error('Avatar error:', e);
                showToast(e.message || 'Ошибка загрузки');
            }
        }

        async function uploadAvatarFromUrl(url) {
            if (!currentUser) return;
            showToast('Загрузка...');
            try {
                const imgRes = await fetch(url);
                const blob = await imgRes.blob();
                const file = new File([blob], 'avatar.jpg', { type: blob.type || 'image/jpeg' });
                await uploadAvatarFile(file);
            } catch (e) {
                console.error('Telegram avatar error:', e);
                showToast('Ошибка загрузки фото');
            }
        }

        function compressImage(file, maxSize, quality) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const reader = new FileReader();
                reader.onload = (e) => { img.src = e.target.result; };
                reader.onerror = reject;
                img.onerror = reject;
                img.onload = () => {
                    let { width, height } = img;
                    if (width > height) {
                        if (width > maxSize) { height = Math.round(height * maxSize / width); width = maxSize; }
                    } else {
                        if (height > maxSize) { width = Math.round(width * maxSize / height); height = maxSize; }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    canvas.toBlob(
                        (blob) => blob ? resolve(blob) : reject(new Error('Сжатие не удалось')),
                        'image/jpeg', quality
                    );
                };
                reader.readAsDataURL(file);
            });
        }

        async function removeAvatar() {
            closeAvatarSheet();
            if (!currentUser) return;
            try {
                const { data, error } = await sb
                    .from('users')
                    .update({ custom_avatar: null })
                    .eq('telegram_id', currentUser.telegram_id)
                    .select()
                    .single();
                if (error) throw error;

                currentUser = data;
                renderProfileAvatar(currentUser);
                showToast('Аватар удалён');
            } catch (e) {
                console.error(e);
                showToast('Ошибка удаления');
            }
        }

        // ============================================================
        // FIND MATCH
        // ============================================================
        async function findMatch() {
            if (!currentUser) { showToast('Сначала авторизуйтесь'); return; }
            const btn = document.getElementById('playBtn');
            const loading = document.getElementById('loading');

            btn.disabled = true;
            btn.textContent = 'ПОИСК...';
            loading.classList.add('active');
            haptic('medium');

            try {
                // Добавляем в очередь (если ещё не там)
                await sb.from('queue').upsert({
                    telegram_id: currentUser.telegram_id,
                    joined_at: new Date().toISOString()
                }, { onConflict: 'telegram_id' });

                setTimeout(() => {
                    showToast('Поиск запущен! Ожидайте соперника.');
                    btn.disabled = false;
                    btn.textContent = '🎮 ИГРАТЬ';
                    loading.classList.remove('active');
                }, 2500);
            } catch (e) {
                console.error('Find match error:', e);
                showToast('Ошибка поиска матча');
                btn.disabled = false;
                btn.textContent = '🎮 ИГРАТЬ';
                loading.classList.remove('active');
            }
        }

        // ============================================================
        // LEADERBOARD
        // ============================================================
        async function loadLeaderboard() {
            try {
                const { data, error } = await sb
                    .from('users')
                    .select('telegram_id, display_name, username, custom_avatar, photo_url, elo')
                    .order('elo', { ascending: false })
                    .limit(50);
                if (error) throw error;
                renderLeaderboard(data);
            } catch (e) {
                console.error('Leaderboard error:', e);
                document.getElementById('leaderboard').innerHTML =
                    '<div class="empty">Не удалось загрузить</div>';
            }
        }

        function renderLeaderboard(data) {
            const container = document.getElementById('leaderboard');
            if (!Array.isArray(data) || data.length === 0) {
                container.innerHTML = '<div class="empty">Пока никого нет</div>';
                return;
            }
            container.innerHTML = data.map((user, i) => {
                const avatarSrc = user.custom_avatar || user.photo_url;
                const initial = (user.display_name || 'U')[0].toUpperCase();
                const avatarHTML = avatarSrc ? `<img src="${avatarSrc}" alt="">` : initial;
                return `
                    <div class="leaderboard-item">
                        <span class="leaderboard-rank">#${i + 1}</span>
                        <div class="lb-avatar">${avatarHTML}</div>
                        <span class="leaderboard-name">${escapeHtml(user.display_name || 'Игрок')}</span>
                        <span class="leaderboard-elo">${user.elo}</span>
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        // FRIENDS
        // ============================================================
        function openFriendsPage() {
            switchPage('friends');
            loadFriends();
        }

        async function searchFriends() {
            const query = document.getElementById('friendSearchInput').value.trim();
            if (query.length < 2) { showToast('Введите минимум 2 символа'); return; }

            const container = document.getElementById('friendSearchResults');
            container.innerHTML = '<div class="empty">Поиск...</div>';

            try {
                const safe = query.replace(/[%_]/g, '');
                const { data, error } = await sb
                    .from('users')
                    .select('telegram_id, display_name, username, custom_avatar, photo_url, elo')
                    .or(`display_name.ilike.%${safe}%,username.ilike.%${safe}%`)
                    .neq('telegram_id', currentUser.telegram_id)
                    .limit(20);
                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="empty">Ничего не найдено</div>';
                    return;
                }

                // Получим список id, с которыми уже есть отношения
                const ids = data.map(u => u.telegram_id);
                const { data: rels } = await sb
                    .from('friendships')
                    .select('requester_id, addressee_id, status')
                    .or(`requester_id.eq.${currentUser.telegram_id},addressee_id.eq.${currentUser.telegram_id}`)
                    .in('requester_id', [currentUser.telegram_id, ...ids])
                    .in('addressee_id', [currentUser.telegram_id, ...ids]);

                const relMap = {};
                (rels || []).forEach(r => {
                    const other = r.requester_id === currentUser.telegram_id
                        ? r.addressee_id
                        : r.requester_id;
                    relMap[other] = r.status;
                });

                container.innerHTML = data.map(u => {
                    const avatarSrc = u.custom_avatar || u.photo_url;
                    const initial = (u.display_name || 'U')[0].toUpperCase();
                    const avatarHTML = avatarSrc ? `<img src="${avatarSrc}" alt="">` : initial;
                    const rel = relMap[u.telegram_id];

                    let actionHtml;
                    if (rel === 'accepted') {
                        actionHtml = `<button class="friend-action pending" disabled>✓ Друг</button>`;
                    } else if (rel === 'pending') {
                        actionHtml = `<button class="friend-action pending" disabled>⏳ Запрос</button>`;
                    } else {
                        actionHtml = `<button class="friend-action add" onclick="sendFriendRequest(${u.telegram_id}, this)">+ Добавить</button>`;
                    }

                    return `
                        <div class="leaderboard-item">
                            <div class="lb-avatar">${avatarHTML}</div>
                            <div style="flex: 1; min-width: 0;">
                                <div class="leaderboard-name">${escapeHtml(u.display_name || 'Игрок')}</div>
                                <div style="font-size: 11px; color: var(--hint);">
                                    ${u.username ? '@' + u.username + ' · ' : ''}ELO ${u.elo}
                                </div>
                            </div>
                            ${actionHtml}
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error('Search error:', e);
                container.innerHTML = '<div class="empty" style="color: var(--red);">Ошибка поиска</div>';
            }
        }

        async function sendFriendRequest(addresseeId, btnEl) {
            if (!currentUser) return;
            if (btnEl) { btnEl.disabled = true; btnEl.textContent = '...'; }
            try {
                const { error } = await sb.from('friendships').insert({
                    requester_id: currentUser.telegram_id,
                    addressee_id: addresseeId,
                    status: 'pending'
                });
                if (error) throw error;
                showToast('✅ Запрос отправлен');
                if (btnEl) {
                    btnEl.className = 'friend-action pending';
                    btnEl.textContent = '⏳ Запрос';
                }
            } catch (e) {
                console.error('Friend request error:', e);
                showToast(e.message || 'Ошибка отправки');
                if (btnEl) { btnEl.disabled = false; btnEl.textContent = '+ Добавить'; }
            }
        }

        async function loadFriends() {
            if (!currentUser) return;
            const container = document.getElementById('friendsList');
            if (!container) return;

            container.innerHTML = '<div class="empty">Загрузка...</div>';

            try {
                const me = currentUser.telegram_id;

                // Забираем все связи где я участник
                const { data: rels, error } = await sb
                    .from('friendships')
                    .select('id, requester_id, addressee_id, status, created_at')
                    .or(`requester_id.eq.${me},addressee_id.eq.${me}`);
                if (error) throw error;

                if (!rels || rels.length === 0) {
                    container.innerHTML = '<div class="empty">Пока нет друзей и запросов</div>';
                    return;
                }

                // Собираем id всех «вторых» участников
                const otherIds = rels.map(r => r.requester_id === me ? r.addressee_id : r.requester_id);

                // Подтягиваем профили одним запросом
                const { data: users, error: uErr } = await sb
                    .from('users')
                    .select('telegram_id, display_name, username, custom_avatar, photo_url, elo')
                    .in('telegram_id', otherIds);
                if (uErr) throw uErr;

                const userMap = {};
                users.forEach(u => { userMap[u.telegram_id] = u; });

                const accepted = [];
                const incoming = [];
                const outgoing = [];

                rels.forEach(r => {
                    const otherId = r.requester_id === me ? r.addressee_id : r.requester_id;
                    const u = userMap[otherId] || { telegram_id: otherId, display_name: 'Игрок', elo: 1000 };
                    const item = { ...r, other: u };

                    if (r.status === 'accepted') accepted.push(item);
                    else if (r.status === 'pending' && r.requester_id !== me) incoming.push(item);
                    else if (r.status === 'pending' && r.requester_id === me) outgoing.push(item);
                });

                let html = '';

                if (incoming.length > 0) {
                    html += '<div class="section-title" style="margin-top: 0;">Входящие запросы</div>';
                    html += incoming.map(renderFriendItem).join('');
                }

                if (accepted.length > 0) {
                    html += '<div class="section-title">Друзья (' + accepted.length + ')</div>';
                    html += accepted.map(r => renderFriendItem(r, 'friend')).join('');
                }

                if (outgoing.length > 0) {
                    html += '<div class="section-title">Исходящие</div>';
                    html += outgoing.map(r => renderFriendItem(r, 'outgoing')).join('');
                }

                if (!html) html = '<div class="empty">Пока нет друзей и запросов</div>';
                container.innerHTML = html;
            } catch (e) {
                console.error('Load friends error:', e);
                container.innerHTML = '<div class="empty" style="color: var(--red);">Ошибка загрузки</div>';
            }
        }

        function renderFriendItem(item, mode) {
            const u = item.other;
            const avatarSrc = u.custom_avatar || u.photo_url;
            const initial = (u.display_name || 'U')[0].toUpperCase();
            const avatarHTML = avatarSrc ? `<img src="${avatarSrc}" alt="">` : initial;

            let actions = '';
            if (mode === 'friend') {
                actions = `<button class="friend-action decline" onclick="removeFriend(${item.id}, this)">✕</button>`;
            } else if (mode === 'outgoing') {
                actions = `<button class="friend-action decline" onclick="removeFriend(${item.id}, this)">Отменить</button>`;
            } else {
                // incoming
                actions = `
                    <button class="friend-action accept" onclick="acceptFriend(${item.id}, this)">✓</button>
                    <button class="friend-action decline" onclick="removeFriend(${item.id}, this)">✕</button>
                `;
            }

            return `
                <div class="leaderboard-item">
                    <div class="lb-avatar">${avatarHTML}</div>
                    <div style="flex: 1; min-width: 0;">
                        <div class="leaderboard-name">${escapeHtml(u.display_name || 'Игрок')}</div>
                        <div style="font-size: 11px; color: var(--hint);">
                            ${u.username ? '@' + u.username + ' · ' : ''}ELO ${u.elo}
                        </div>
                    </div>
                    <div style="display: flex; gap: 6px;">${actions}</div>
                </div>
            `;
        }

        async function acceptFriend(friendshipId, btnEl) {
            try {
                const { error } = await sb
                    .from('friendships')
                    .update({ status: 'accepted' })
                    .eq('id', friendshipId);
                if (error) throw error;
                showToast('✅ Теперь вы друзья');
                loadFriends();
            } catch (e) {
                console.error(e);
                showToast('Ошибка');
            }
        }

        async function removeFriend(friendshipId, btnEl) {
            try {
                const { error } = await sb
                    .from('friendships')
                    .delete()
                    .eq('id', friendshipId);
                if (error) throw error;
                showToast('Удалено');
                loadFriends();
            } catch (e) {
                console.error(e);
                showToast('Ошибка');
            }
        }

        // ============================================================
        // HELPERS
        // ============================================================
        function haptic(style = 'light') {
            try { tg?.HapticFeedback?.impactOccurred(style); } catch (e) {}
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        let toastTimer;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        init();
    </script>
</body>
</html>
