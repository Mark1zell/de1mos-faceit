<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>De1mos Faceit</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #0f0f23);
            --text: var(--tg-theme-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #8b8b9e);
            --accent: #ff6b35;
            --card: var(--tg-theme-secondary-bg-color, #1a1a2e);
            --green: #4ade80;
            --red: #f87171;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
            -webkit-tap-highlight-color: transparent;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--card);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #ff8c42);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 16px; overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .header-title { font-size: 18px; font-weight: 700; }
        .header-title span { color: var(--accent); }
        .notif-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.08); border: none;
            color: var(--text); font-size: 18px; cursor: pointer;
        }
        .container { padding: 16px 20px; }
        .elo-card {
            background: linear-gradient(135deg, #1e1e3a, #2a2a4a);
            border-radius: 20px; padding: 24px; margin-bottom: 16px;
            border: 1px solid rgba(255,107,53,0.3);
        }
        .elo-label { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--hint); }
        .elo-value { font-size: 48px; font-weight: 800; color: var(--accent); }
        .elo-level {
            display: inline-block; background: rgba(255,107,53,0.15);
            color: var(--accent); padding: 4px 12px; border-radius: 20px;
            font-size: 13px; font-weight: 600; margin-top: 8px;
        }
        .elo-progress { margin-top: 16px; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; }
        .elo-progress-bar {
            height: 100%; background: linear-gradient(90deg, var(--accent), #ff8c42);
            border-radius: 3px; transition: width 0.5s ease; width: 0%;
        }
        .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .stat-card { background: var(--card); border-radius: 14px; padding: 14px; text-align: center; }
        .stat-value { font-size: 22px; font-weight: 700; }
        .stat-label { font-size: 11px; color: var(--hint); margin-top: 2px; text-transform: uppercase; }
        .play-btn {
            width: 100%; padding: 18px; border: none; border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), #ff8c42);
            color: #fff; font-size: 18px; font-weight: 700;
            cursor: pointer; margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(255,107,53,0.4);
        }
        .play-btn:disabled { opacity: 0.5; }
        .section-title { font-size: 13px; text-transform: uppercase; color: var(--hint); margin-bottom: 10px; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .menu-item {
            background: var(--card); border-radius: 14px; padding: 16px;
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            border: none; color: var(--text); font-size: 14px; font-weight: 600;
        }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--card); display: flex; justify-content: space-around;
            padding: 8px 0 12px; border-top: 1px solid rgba(255,255,255,0.06); z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            background: none; border: none; color: var(--hint);
            font-size: 10px; cursor: pointer; padding: 4px 12px;
        }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 20px; }
        .loading { display: none; text-align: center; padding: 20px; color: var(--hint); }
        .loading.active { display: block; }
        .spinner {
            width: 32px; height: 32px; border: 3px solid rgba(255,107,53,0.2);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast {
            position: fixed; bottom: 100px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--card); color: var(--text); padding: 12px 24px;
            border-radius: 12px; font-size: 14px; opacity: 0;
            transition: all 0.3s; pointer-events: none;
            border: 1px solid rgba(255,107,53,0.3); z-index: 200;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .leaderboard-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: var(--card);
            border-radius: 12px; margin-bottom: 8px;
        }
        .leaderboard-rank { font-size: 18px; font-weight: 700; color: var(--accent); width: 30px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="avatar" id="headerAvatar">?</div>
        <div class="header-title">De1mos <span>Faceit</span></div>
        <button class="notif-btn" onclick="showToast('Уведомлений пока нет')">🔔</button>
    </header>

    <div class="container" id="dashboard">
        <div class="elo-card">
            <div class="elo-label">Ваш рейтинг</div>
            <div class="elo-value" id="eloValue">—</div>
            <div class="elo-level" id="eloLevel">Уровень —</div>
            <div class="elo-progress">
                <div class="elo-progress-bar" id="eloProgress"></div>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value" id="statMatches">—</div>
                <div class="stat-label">Матчей</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statWins">—</div>
                <div class="stat-label">Побед</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statWinrate">—</div>
                <div class="stat-label">Winrate</div>
            </div>
        </div>

        <button class="play-btn" id="playBtn" onclick="findMatch()">🎮 ИГРАТЬ</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Поиск матча...</div>
        </div>

        <div class="section-title">Лидерборд</div>
        <div id="leaderboard"></div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="showPage('dashboard')">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </button>
        <button class="nav-item" onclick="showPage('profile')">
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </button>
        <button class="nav-item" onclick="showToast('Раздел в разработке')">
            <span class="nav-icon">🏆</span>
            <span>Клубы</span>
        </button>
        <button class="nav-item" onclick="showToast('Раздел в разработке')">
            <span class="nav-icon">💬</span>
            <span>Чат</span>
        </button>
    </nav>

    <div class="toast" id="toast"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ЗАМЕНИТЕ НА ВАШ URL БЭКЕНДА НА RENDER
        const API_URL = 'https://your-app.onrender.com';

        let currentUser = null;

        async function init() {
            const user = tg.initDataUnsafe?.user;
            if (!user) {
                showToast('Откройте приложение через Telegram');
                // For browser testing, use demo data
                loadDemoData();
                return;
            }

            const avatarEl = document.getElementById('headerAvatar');
            if (user.photo_url) {
                avatarEl.innerHTML = `<img src="${user.photo_url}" alt="">`;
            } else {
                avatarEl.textContent = (user.first_name || 'U')[0].toUpperCase();
            }

            try {
                const res = await fetch(`${API_URL}/api/auth`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: user.id,
                        username: user.username,
                        first_name: user.first_name,
                        last_name: user.last_name,
                        photo_url: user.photo_url
                    })
                });

                if (!res.ok) throw new Error('Auth failed');

                currentUser = await res.json();
                updateUI(currentUser);
                loadLeaderboard();
            } catch (e) {
                console.error('Init error:', e);
                showToast('Ошибка загрузки профиля');
                loadDemoData();
            }
        }

        function loadDemoData() {
            const demo = {
                telegram_id: 123456789,
                display_name: 'Demo Player',
                elo: 1250,
                level: 5,
                matches_played: 42,
                wins: 25,
                winrate: 59.5
            };
            currentUser = demo;
            updateUI(demo);
        }

        function updateUI(user) {
            document.getElementById('eloValue').textContent = user.elo;
            document.getElementById('eloLevel').textContent = `Уровень ${user.level}`;
            document.getElementById('statMatches').textContent = user.matches_played;
            document.getElementById('statWins').textContent = user.wins;
            document.getElementById('statWinrate').textContent = user.winrate + '%';
            const progress = ((user.elo % 250) / 250) * 100;
            document.getElementById('eloProgress').style.width = progress + '%';
        }

        async function findMatch() {
            if (!currentUser) {
                showToast('Сначала авторизуйтесь');
                return;
            }

            const btn = document.getElementById('playBtn');
            const loading = document.getElementById('loading');

            btn.disabled = true;
            btn.textContent = 'ПОИСК...';
            loading.classList.add('active');

            try {
                await fetch(`${API_URL}/api/find_match`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: currentUser.telegram_id,
                        mode: 'standoff2'
                    })
                });

                tg.sendData(JSON.stringify({
                    action: 'find_match',
                    mode: 'standoff2'
                }));

                showToast('Поиск запущен! Уведомление придёт в бот.');

                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = '🎮 ИГРАТЬ';
                    loading.classList.remove('active');
                }, 3000);

            } catch (e) {
                console.error('Find match error:', e);
                showToast('Ошибка поиска матча');
                btn.disabled = false;
                btn.textContent = '🎮 ИГРАТЬ';
                loading.classList.remove('active');
            }
        }

        async function loadLeaderboard() {
            try {
                const res = await fetch(`${API_URL}/api/leaderboard`);
                const data = await res.json();
                const container = document.getElementById('leaderboard');
                container.innerHTML = data.map((user, i) => `
                    <div class="leaderboard-item">
                        <span class="leaderboard-rank">#${i + 1}</span>
                        <span>${user.display_name}</span>
                        <span style="color: var(--accent); font-weight: 700;">${user.elo}</span>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Leaderboard error:', e);
            }
        }

        function showPage(page) {
            if (page === 'profile') {
                showToast('Профиль: ELO ' + (currentUser?.elo || '—'));
            }
        }

        let toastTimer;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        init();
    </script>
</body>
</html>
